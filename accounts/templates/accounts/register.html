{% extends "menu/base.html" %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
    <section class="auth-card">
        <h1>Створіть акаунт</h1>
        <p class="auth-intro">Зареєструйтеся, щоб користуватися всіма можливостями.</p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary auth-submit">Зареєструватися</button>
        </form>

        <p class="auth-switch">Вже маєте акаунт? <a href='{% url "accounts:login" %}'>Увійти</a></p>
    </section>
{% endblock %}
