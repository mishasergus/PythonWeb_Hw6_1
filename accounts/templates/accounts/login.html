{% extends "menu/base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
    <section class="auth-card">
        <h1>Раді вас бачити!</h1>
        <p class="auth-intro">Увійдіть, щоб продовжити.</p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}"/>
            <button type="submit" class="btn btn-primary auth-submit">Увійти</button>
        </form>

        <p class="auth-switch">Ще не маєте акаунта? <a href='{% url "accounts:register" %}'>Зареєструватися</a></p>
    </section>
{% endblock %}
