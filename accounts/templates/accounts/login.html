{% extends "menu/base.html" %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
    <h1>Вхід</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next", value="{{ next }}"/>
        <button type="submit">Увійти</button>
    </form>

    <p> Ще не має акаунта? <a href='{% url "accounts:register" %}'>Зареєструватися</a></p>
{% endblock %}
