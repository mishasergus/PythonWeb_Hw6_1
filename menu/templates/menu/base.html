<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>{% block title %}Піцерія{% endblock %}</title>
<style>
        body { font-family: Arial, sans-serif; margin: 0; background: #faf6f0; }
        nav { background: #b22222; padding: 15px 30px; display: flex; gap: 20px; align-items: center; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; padding: 15px 20px; margin-bottom: 15px;
                border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .price { color: #b22222; font-weight: bold; }
        .filter-form, .dish-form { background: white; padding: 20px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .form-control { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-block; }
        .btn-primary { background: #b22222; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-warning { background: #ffc107; color: black; }
        .btn-danger { background: #dc3545; color: white; }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
        .nav-right { margin-left: auto; color: white; display: flex; align-items: center; gap: 15px; }
        .nav-right form { margin: 0; }
        .nav-right button { background: none; border: 1px solid white; color: white;
                            padding: 5px 12px; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>
<nav>
    <a href="{% url 'menu:home' %}">Головна</a>
    <a href="{% url 'menu:menu_list' %}">Меню</a>
    <a href="{% url 'menu:dish_create' %}">+ Додати страву</a>

    <div class="nav-right">
        {% if user.is_authenticated %}
            <span>{{ user.username }}</span>
            <form method="post" action='{% url "accounts:logout" %}'>
                {% csrf_token %}
                <button type="submit">Вийти</button>
            </form>
        {% else %}
            <a href='{% url "accounts:login" %}'>Увійти</a>
            <a href='{% url "accounts:register" %}'>Зареєструватися</a>
        {% endif %}
    </div>
</nav>
<main>
        {% if messages %}
        {% for message in messages %}
            <div>{{message}}</div>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
</main>
</body>
</html>
