<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>{% block title %}Піцерія{% endblock %}</title>
<style>
        body { font-family: Arial, sans-serif; margin: 0; background: #faf6f0; }
        nav { background: #b22222; padding: 15px 30px; display: flex; gap: 20px; align-items: center; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; padding: 15px 20px; margin-bottom: 15px;
                border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .price { color: #b22222; font-weight: bold; }
        .filter-form, .dish-form { background: white; padding: 20px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .form-control { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-block; }
        .btn-primary { background: #b22222; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-warning { background: #ffc107; color: black; }
        .btn-danger { background: #dc3545; color: white; }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
        .nav-right { margin-left: auto; color: white; display: flex; align-items: center; gap: 15px; }
        .nav-right form { margin: 0; }
        .nav-right button { background: none; border: 1px solid white; color: white;
                            padding: 5px 12px; border-radius: 5px; cursor: pointer; }
        .auth-card { max-width: 440px; margin: 48px auto; padding: 32px;
                     background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(70, 38, 20, 0.12); }
        .auth-card h1 { margin: 0; color: #38251d; font-size: 28px; }
        .auth-intro { margin: 8px 0 24px; color: #75665f; }
        .auth-form p { margin: 0 0 18px; }
        .auth-form label { display: block; margin-bottom: 7px; color: #38251d; font-weight: bold; }
        .auth-form input { box-sizing: border-box; width: 100%; padding: 11px 12px;
                           border: 1px solid #d8cec7; border-radius: 6px; font: inherit; }
        .auth-form input:focus { outline: 2px solid #b22222; outline-offset: 1px; border-color: #b22222; }
        .auth-form ul { margin: 6px 0 0; padding-left: 20px; color: #b22222; font-size: 14px; }
        .auth-form .helptext { display: block; margin-top: 6px; color: #75665f; font-size: 13px; }
        .auth-submit { width: 100%; margin-top: 4px; padding: 11px 15px; font-weight: bold; }
        .auth-switch { margin: 22px 0 0; text-align: center; color: #75665f; }
        .auth-switch a { color: #b22222; font-weight: bold; text-decoration: none; }
        .auth-switch a:hover { text-decoration: underline; }
        @media (max-width: 520px) {
            .auth-card { margin: 24px auto; padding: 24px 20px; }
            nav { padding: 12px 16px; flex-wrap: wrap; }
        }
</style>
</head>
<body>
<nav>
    <a href="{% url 'menu:home' %}">Головна</a>
    <a href="{% url 'menu:menu_list' %}">Меню</a>
    <a href="{% url 'menu:dish_create' %}">+ Додати страву</a>

    <div class="nav-right">
        {% if user.is_authenticated %}
            <span>{{ user.username }}</span>
            <form method="post" action='{% url "accounts:logout" %}'>
                {% csrf_token %}
                <button type="submit">Вийти</button>
            </form>
        {% else %}
            <a href='{% url "accounts:login" %}'>Увійти</a>
            <a href='{% url "accounts:register" %}'>Зареєструватися</a>
        {% endif %}
    </div>
</nav>
<main>
        {% if messages %}
        {% for message in messages %}
            <div>{{message}}</div>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
</main>
</body>
</html>
