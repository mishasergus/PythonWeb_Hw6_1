{% extends "menu/base.html" %}
 
{% block title %}{{ dish.name }}{% endblock %}
 
{% block content %}
    <h1>{{ dish.name }}</h1>
    <p>{{ dish.description }}</p>
    <p class="price">Ціна: {{ dish.price }} грн</p>

    <div class="actions" style="margin-bottom: 20px;">
        <a href="{% url 'menu:dish_update' %}?id={{ dish.id }}" class="btn btn-warning">Редагувати</a>

        <form action="{% url 'menu:dish_delete' %}" method="post" style="display:inline;" onsubmit="return confirm('Ви дійсно бажаєте видалити цю страву?');">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ dish.id }}">
            <button type="submit" class="btn btn-danger">Видалити</button>
        </form>
    </div>

    <a href="{% url 'menu:menu_list' %}">← Назад до меню</a>
{% endblock %}
